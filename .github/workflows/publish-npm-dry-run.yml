name: Publish to npm (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Run library tests
        run: npm run test

      - name: Determine npm dist-tag
        run: |
          TAG=$(node -p "const m = require('./package.json').version.match(/-([a-zA-Z0-9]+)/); (m ? m[1] : 'latest').toLowerCase()")
          echo "NPM_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify package contents (dry run)
        run: |
          npm publish --dry-run --access public --tag "$NPM_TAG"
          npm pack --dry-run --json | node .github/scripts/check-package-files.mjs
